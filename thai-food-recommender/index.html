<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อร่อยไทย | Thai Food Recommender</title>
<style>
  :root {
    --red: #9a2a2a;
    --red-dark: #7a1f1f;
    --gold: #c9972b;
    --gold-light: #e8c073;
    --cream: #fdf6e7;
    --cream-2: #fbecc9;
    --text: #3a2318;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Sarabun", "Tahoma", sans-serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }

  .page {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 2rem;
    color: var(--red-dark);
  }

  header p {
    margin: 0;
    color: #7a5c47;
    font-size: 0.95rem;
  }

  .featured-card {
    position: relative;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(154, 42, 42, 0.15);
    border: 1px solid var(--gold-light);
    transition: transform 0.15s ease;
  }

  .featured-icon {
    font-size: 4.5rem;
    line-height: 1;
    margin-bottom: 12px;
  }

  .featured-icon img {
    width: 4.5rem;
    height: 4.5rem;
    object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(154, 42, 42, 0.2);
  }

  .featured-name-th {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--red-dark);
    margin: 0 0 2px;
  }

  .featured-name-en {
    font-size: 1rem;
    color: #a07a4f;
    font-style: italic;
    margin: 0 0 14px;
  }

  .featured-desc {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 14px;
  }

  .category-tag {
    display: inline-block;
    background: var(--cream-2);
    color: var(--red-dark);
    border: 1px solid var(--gold-light);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 0.8rem;
  }

  .ingredients-btn {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: 1px solid var(--gold-light);
    color: var(--red-dark);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.12s ease;
  }

  .ingredients-btn:hover {
    background: var(--cream-2);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(58, 35, 24, 0.5);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    position: relative;
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px 24px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.2rem;
    color: #a07a4f;
    cursor: pointer;
    line-height: 1;
  }

  .modal-icon {
    font-size: 3rem;
    line-height: 1;
    margin-bottom: 8px;
  }

  .modal-icon img {
    width: 3rem;
    height: 3rem;
    object-fit: cover;
    border-radius: 50%;
  }

  .modal-box h3 {
    margin: 0 0 2px;
    color: var(--red-dark);
    font-size: 1.3rem;
  }

  .modal-box .modal-name-en {
    margin: 0 0 16px;
    color: #a07a4f;
    font-style: italic;
    font-size: 0.9rem;
  }

  .modal-box h4 {
    margin: 0 0 10px;
    color: var(--red-dark);
    font-size: 0.95rem;
    text-align: left;
  }

  .ingredients-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-start;
  }

  .ingredient-chip {
    background: var(--cream-2);
    border: 1px solid var(--gold-light);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.82rem;
    color: var(--text);
  }

  .fav-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    filter: grayscale(1) opacity(0.5);
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .fav-btn:hover {
    transform: scale(1.15);
  }

  .fav-btn.active {
    filter: none;
  }

  .actions {
    text-align: center;
    margin: 22px 0 8px;
  }

  #randomBtn {
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 1.05rem;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(122, 31, 31, 0.35);
    transition: transform 0.12s ease;
  }

  #randomBtn:active {
    transform: scale(0.97);
  }

  .favorites-section {
    margin-top: 40px;
  }

  .favorites-section h2 {
    font-size: 1.2rem;
    color: var(--red-dark);
    text-align: center;
    margin-bottom: 14px;
  }

  #favoritesList {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .fav-card {
    background: #fff;
    border: 1px solid var(--gold-light);
    border-radius: 14px;
    padding: 14px 10px 12px;
    text-align: center;
    position: relative;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .fav-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(154, 42, 42, 0.15);
  }

  .fav-card .icon {
    font-size: 1.8rem;
  }

  .fav-card .icon img {
    width: 1.8rem;
    height: 1.8rem;
    object-fit: cover;
    border-radius: 50%;
    vertical-align: middle;
  }

  .fav-card .name-th {
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .fav-card .name-en {
    font-size: 0.72rem;
    color: #a07a4f;
    font-style: italic;
  }

  .fav-card .remove-btn {
    position: absolute;
    top: 2px;
    right: 6px;
    background: none;
    border: none;
    color: #b76a6a;
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
  }

  #emptyState {
    text-align: center;
    color: #a07a4f;
    font-size: 0.9rem;
    padding: 20px 10px;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.78rem;
    color: #b79a7a;
  }

  @media (max-width: 400px) {
    #favoritesList {
      grid-template-columns: 1fr;
    }
    header h1 {
      font-size: 1.6rem;
    }
    .featured-icon {
      font-size: 3.6rem;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>อร่อยไทย 🇹🇭</h1>
      <p>Thai Food Recommender — สุ่มเมนูอาหารไทยแล้วเก็บเมนูที่ชอบไว้ดูภายหลัง</p>
    </header>

    <main>
      <section class="featured-card" id="featuredCard">
        <button class="fav-btn" id="favBtn" aria-label="บันทึกรายการโปรด">🤍</button>
        <div class="featured-icon" id="featuredIcon">🍽️</div>
        <p class="featured-name-th" id="featuredNameTh">กำลังสุ่ม...</p>
        <p class="featured-name-en" id="featuredNameEn"></p>
        <p class="featured-desc" id="featuredDesc"></p>
        <span class="category-tag" id="featuredCategory"></span>
        <button class="ingredients-btn" id="ingredientsBtn">📋 ดูส่วนประกอบ</button>
      </section>

      <div class="actions">
        <button id="randomBtn">🎲 สุ่มอาหารไทยวันนี้</button>
      </div>

      <section class="favorites-section">
        <h2>รายการโปรดของฉัน ❤️</h2>
        <div id="favoritesList"></div>
        <p id="emptyState">ยังไม่มีรายการโปรด กดหัวใจบนเมนูที่ชอบเพื่อบันทึกไว้ที่นี่</p>
      </section>
    </main>

    <footer>บันทึกรายการโปรดไว้ในเบราว์เซอร์ของคุณเท่านั้น (localStorage)</footer>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalNameTh">
      <button class="modal-close" id="modalClose" aria-label="ปิด">✕</button>
      <div class="modal-icon" id="modalIcon"></div>
      <h3 id="modalNameTh"></h3>
      <p class="modal-name-en" id="modalNameEn"></p>
      <h4>ส่วนประกอบ</h4>
      <div class="ingredients-list" id="modalIngredients"></div>
    </div>
  </div>

    { id: 26, th: "ผัดพริกแกงหมูกรอบ", en: "Stir-fried Crispy Pork with Curry Paste", desc: "หมูกรอบผัดพริกแกงหอมใบมะกรูด", category: "ผัด", icon: "🌶️", img: "image/chili.png", ingredients: ["หมูกรอบ", "พริกแกงเผ็ด", "ใบมะกรูด", "ถั่วฝักยาว", "พริกชี้ฟ้า"] },
    { id: 27, th: "ขนมครก", en: "Kanom Krok", desc: "ขนมหวานแป้งกะทิหอมมัน อบในเตาดินเผา", category: "ของหวาน", icon: "🍮", ingredients: ["แป้งข้าวเจ้า", "กะทิ", "น้ำตาลปี๊บ", "ต้นหอม", "ข้าวโพดอ่อน"] },
    { id: 28, th: "ทับทิมกรอบ", en: "Tub Tim Krob", desc: "ขนมหวานเชือกลูกแห้วเคลือบแป้งคลุกน้ำแข็งกะทิ", category: "ของหวาน", icon: "🍧", ingredients: ["แห้วสด", "แป้งมัน", "กะทิ", "น้ำตาลทราย", "น้ำแข็งไส"] },
    { id: 29, th: "ชาไทย", en: "Thai Iced Tea", desc: "ชานมเย็นสีส้มหวานมันเข้มข้น", category: "เครื่องดื่ม", icon: "🧋", ingredients: ["ชาไทยผง", "นมข้นหวาน", "นมสด", "น้ำแข็ง"] },
    { id: 30, th: "น้ำมะนาว", en: "Thai Lime Juice", desc: "น้ำมะนาวปั่นรสเปรี้ยวหวานชื่นใจ", category: "เครื่องดื่ม", icon: "🍹", ingredients: ["มะนาว", "น้ำเชื่อม", "โซดาหรือน้ำเปล่า", "น้ำแข็ง"] }
  ];

  let favorites = new Set();
  try {
    favorites = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) || []);
  } catch (e) {
    favorites = new Set();
  }

  let currentDish = null;

  const featuredIcon = document.getElementById("featuredIcon");
  const featuredNameTh = document.getElementById("featuredNameTh");
  const featuredNameEn = document.getElementById("featuredNameEn");
  const featuredDesc = document.getElementById("featuredDesc");
  const featuredCategory = document.getElementById("featuredCategory");
  const favBtn = document.getElementById("favBtn");
  const randomBtn = document.getElementById("randomBtn");
  const favoritesList = document.getElementById("favoritesList");
  const emptyState = document.getElementById("emptyState");
  const ingredientsBtn = document.getElementById("ingredientsBtn");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalClose = document.getElementById("modalClose");
  const modalIcon = document.getElementById("modalIcon");
  const modalNameTh = document.getElementById("modalNameTh");
  const modalNameEn = document.getElementById("modalNameEn");
  const modalIngredients = document.getElementById("modalIngredients");

  function saveFavorites() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...favorites]));
    } catch (e) {
      /* localStorage unavailable, favorites stay in-memory for this session */
    }
  }

  function renderFeatured() {
    if (currentDish.img) {
      featuredIcon.innerHTML = `<img src="${currentDish.img}" alt="${currentDish.th}">`;
    } else {
      featuredIcon.textContent = currentDish.icon;
    }
    featuredNameTh.textContent = currentDish.th;
    featuredNameEn.textContent = currentDish.en;
    featuredDesc.textContent = currentDish.desc;
    featuredCategory.textContent = currentDish.category;

    const isFav = favorites.has(currentDish.id);
    favBtn.textContent = isFav ? "❤️" : "🤍";
    favBtn.classList.toggle("active", isFav);
  }

  function pickRandom() {
    const idx = Math.floor(Math.random() * dishes.length);
    currentDish = dishes[idx];
    renderFeatured();
  }

  function toggleFavorite() {
    if (favorites.has(currentDish.id)) {
      favorites.delete(currentDish.id);
    } else {
      favorites.add(currentDish.id);
    }
    saveFavorites();
    renderFeatured();
    renderFavorites();
  }

  function setFeaturedById(id) {
    const dish = dishes.find((d) => d.id === id);
    if (!dish) return;
    currentDish = dish;
    renderFeatured();
  }

  function removeFavorite(id) {
    favorites.delete(id);
    saveFavorites();
    if (currentDish && currentDish.id === id) {
      renderFeatured();
    }
    renderFavorites();
  }

  function renderFavorites() {
    favoritesList.innerHTML = "";

    if (favorites.size === 0) {
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    [...favorites].forEach((id) => {
      const dish = dishes.find((d) => d.id === id);
      if (!dish) return;

      const card = document.createElement("div");
      card.className = "fav-card";
      const iconHtml = dish.img
        ? `<img src="${dish.img}" alt="${dish.th}">`
        : dish.icon;
      card.innerHTML = `
        <button class="remove-btn" aria-label="เอาออกจากรายการโปรด">✕</button>
        <div class="icon">${iconHtml}</div>
        <div class="name-th">${dish.th}</div>
        <div class="name-en">${dish.en}</div>
      `;

      card.addEventListener("click", () => setFeaturedById(dish.id));
      card.querySelector(".remove-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        removeFavorite(dish.id);
      });

      favoritesList.appendChild(card);
    });
  }

  function openIngredientsModal() {
    if (modalIcon) {
      modalIcon.innerHTML = currentDish.img
        ? `<img src="${currentDish.img}" alt="${currentDish.th}">`
        : currentDish.icon;
    }
    modalNameTh.textContent = currentDish.th;
    modalNameEn.textContent = currentDish.en;
    modalIngredients.innerHTML = (currentDish.ingredients || [])
      .map((item) => `<span class="ingredient-chip">${item}</span>`)
      .join("");
    modalOverlay.classList.add("open");
  }

  function closeIngredientsModal() {
    modalOverlay.classList.remove("open");
  }

  randomBtn.addEventListener("click", pickRandom);
  favBtn.addEventListener("click", toggleFavorite);
  ingredientsBtn.addEventListener("click", openIngredientsModal);
  modalClose.addEventListener("click", closeIngredientsModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeIngredientsModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeIngredientsModal();
  });

  pickRandom();
  renderFavorites();
</script>
</body>
</html>
